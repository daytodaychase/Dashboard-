<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day To Day Show · Release</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Courier+Prime:wght@400;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#1a1410;--panel:#241c16;--panel2:#2e241c;--line:#3b2f25;--cream:#f2e8d5;--cream2:#b9ab94;--orange:#d9622b;--orange2:#f08a4b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--cream);font-family:'Courier Prime',monospace;padding:20px 16px 60px;max-width:640px;margin:0 auto}
  h1{font-family:'Anton',sans-serif;font-size:clamp(30px,9vw,54px);white-space:nowrap;letter-spacing:.02em;line-height:.95;text-transform:uppercase}
  .sub{font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--cream2);margin-top:8px}
  .tag{font-family:'Caveat',cursive;color:var(--orange2);font-size:24px;margin-top:6px}
  .box{background:var(--panel);border-top:5px solid var(--orange);padding:16px;margin-top:22px}
  .box p{font-size:14px;line-height:1.55;margin-bottom:12px}
  .box p.warn{color:var(--orange2);font-weight:700}
  label{display:block;font-size:11px;color:var(--cream2);margin:14px 0 4px;text-transform:uppercase;letter-spacing:.06em}
  input{width:100%;background:var(--bg);color:var(--cream);border:1px solid var(--line);padding:12px;font-family:'Courier Prime',monospace;font-size:16px}
  .check{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px}
  .check input{width:auto}
  canvas{width:100%;height:180px;background:#fff;border:1px solid var(--line);touch-action:none;display:block;margin-top:6px}
  .row{display:flex;gap:10px;margin-top:8px}
  .btn{background:var(--orange);color:#1a1410;border:0;font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:15px;padding:14px 18px;cursor:pointer;flex:1}
  .btn.ghost{background:transparent;color:var(--cream2);border:1px solid var(--line);flex:0 0 auto}
  .done{text-align:center;padding:40px 10px}
  .done .big{font-family:'Anton',sans-serif;font-size:40px;color:var(--orange2)}
  .err{color:var(--orange2);font-size:13px;margin-top:10px;min-height:18px}
</style>
</head>
<body>
<header>
  <h1>Daytoday Show</h1>
  <div class="sub">Guest release</div>
  <div class="tag" id="who">loading…</div>
</header>

<div class="box" id="form" style="display:none">
  <div id="release"></div>
  <label>Your full legal name</label>
  <input id="name" placeholder="First Last" autocomplete="name">
  <div class="check"><input type="checkbox" id="minor"><label for="minor" style="margin:0">I am under 18</label></div>
  <div id="guardianWrap" style="display:none">
    <label>Parent or guardian full name</label>
    <input id="guardian" placeholder="First Last">
  </div>
  <label>Sign with your finger</label>
  <canvas id="pad"></canvas>
  <div class="row">
    <button class="btn ghost" onclick="clearPad()">Clear</button>
    <button class="btn" id="signBtn" onclick="submit()">I agree and sign</button>
  </div>
  <div class="err" id="err"></div>
</div>

<div class="box done" id="done" style="display:none">
  <div class="big">Signed ✓</div>
  <p style="margin-top:12px">You're all set. See you on shoot day.</p>
</div>

<script>
const FN='https://gzupnelfmehgdxfhntar.supabase.co/functions/v1/show-shoot';
const token=new URLSearchParams(location.search).get('t')||'';
const $=id=>document.getElementById(id);

async function load(){
  if(!token){$('who').textContent='bad link';return}
  const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'guest',token})});
  const d=await r.json();
  if(d.error){$('who').textContent='this link is not valid';return}
  $('who').textContent=`${d.handle}${d.date?' · shoot '+fmt(d.date):''}`;
  if(d.signed){$('done').style.display='block';$('done').querySelector('p').textContent='Already signed by '+(d.signedName||'you')+'.';return}
  $('release').innerHTML=`<p class="warn">${esc(d.title)}</p>`+d.text.map(t=>`<p>${esc(t)}</p>`).join('');
  $('form').style.display='block';
  initPad();
}
function fmt(d){return new Date(d+'T00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

$('minor').addEventListener('change',e=>{$('guardianWrap').style.display=e.target.checked?'block':'none'});

let ctx,drawing=false,drew=false,cv;
function initPad(){
  cv=$('pad');const scale=window.devicePixelRatio||1;
  cv.width=cv.clientWidth*scale;cv.height=180*scale;
  ctx=cv.getContext('2d');ctx.scale(scale,scale);
  ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.clientWidth,180);
  ctx.lineWidth=2.5;ctx.lineCap='round';ctx.strokeStyle='#111';
  const pos=e=>{const r=cv.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return[p.clientX-r.left,p.clientY-r.top]};
  const start=e=>{drawing=true;const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y);e.preventDefault()};
  const move=e=>{if(!drawing)return;const[x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke();drew=true;e.preventDefault()};
  const end=()=>{drawing=false};
  cv.addEventListener('pointerdown',start);cv.addEventListener('pointermove',move);window.addEventListener('pointerup',end);
}
function clearPad(){ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.clientWidth,180);drew=false}

async function submit(){
  const name=$('name').value.trim(),minor=$('minor').checked,guardian=$('guardian').value.trim();
  $('err').textContent='';
  if(!name){$('err').textContent='type your full name';return}
  if(minor&&!guardian){$('err').textContent='parent or guardian name needed';return}
  if(!drew){$('err').textContent='sign in the white box';return}
  $('signBtn').disabled=true;$('signBtn').textContent='saving…';
  const sig=cv.toDataURL('image/jpeg',0.85);
  try{
    const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'sign',token,name,minor,guardian,signature:sig})});
    const d=await r.json();
    if(d.ok){$('form').style.display='none';$('done').style.display='block'}
    else{$('err').textContent=d.error||'something went wrong';$('signBtn').disabled=false;$('signBtn').textContent='I agree and sign'}
  }catch(e){$('err').textContent='no connection, try again';$('signBtn').disabled=false;$('signBtn').textContent='I agree and sign'}
}
load();
</script>
</body>
</html>
