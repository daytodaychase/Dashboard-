// ---------- talking to the servers ----------
function rowsFrom(result){
  let p = result && result.payload;
  if (Array.isArray(p)) return p;
  if (p && typeof p === "object" && typeof p.result === "string") p = p.result;
  if (typeof p !== "string") {
    const block = ((result && result.content) || []).find(b => b.type === "text");
    p = block ? block.text : "";
    try { const o = JSON.parse(p); if (Array.isArray(o)) return o; if (o && typeof o.result === "string") p = o.result; } catch (e) {}
  }
  const m = p.match(/<untrusted-data-[^>]*>\s*([\s\S]*?)\s*<\/untrusted-data-/);
  const body = m ? m[1] : p;
  const a = body.indexOf("["), z = body.lastIndexOf("]");
  if (a < 0 || z < a) throw { message: "Supabase answered in a way the app can't read." };
  return JSON.parse(body.slice(a, z + 1));
}
async function sql(q){ return rowsFrom(await MCP.callTool("Supabase", "execute_sql", { project_id: PROJECT, query: q }, { cache: false })); }
async function callFn(fn, action, extra){
  const body = Object.assign({ action }, extra || {});
  if (HOSTED) {
    let r;
    try { r = await fetch(BASE + fn, { method: "POST", headers: { "Content-Type": "application/json", "x-show-key": KEY }, body: JSON.stringify(body) }); }
    catch (e) { throw { message: "Can't reach your server. Check your signal and try again." }; }
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) throw { code: "bad_key", message: "That key didn't work." };
    if (!r.ok || j.ok === false) throw { message: j.error || ("Server error " + r.status) };
    return j;
  }
  const payload = JSON.stringify(body).replace(/'/g, "''");
  const rows = await sql("select net.http_post(url := '" + BASE + fn + "', headers := jsonb_build_object('Content-Type','application/json','Authorization','Bearer ' || (select value from show_secrets where key = 'callback_token')), body := '" + payload + "'::jsonb, timeout_milliseconds := 60000) as id");
  const id = Number(rows[0] && rows[0].id);
  for (let i = 0; i < 30; i++) {
    await new Promise(r => setTimeout(r, i < 3 ? 700 : 1500));
    const got = await sql("select status_code, content from net._http_response where id = " + id);
    if (got.length) {
      let j = {}; try { j = JSON.parse(got[0].content); } catch (e) {}
      if (got[0].status_code >= 400 || j.ok === false) throw { message: j.error || ("Server error " + got[0].status_code) };
      return j;
    }
  }
  throw { message: "That took too long. Try again." };
}

function rowItem(it, first, withDate){

    <span style="flex:1;min-width:0;color:var(--badtext);font-weight:700">${esc(it.title)}</span><span style="color:var(--badtext);font-size:22px;font-weight:700" aria-hidden="true">+</span></button>`;

    <i aria-hidden="true" style="flex:none;width:12px;height:12px;border-radius:50%;background:${st[1]}"></i></button>`;
}
function reach(brand, link){
  const L = (D.stats && D.stats.latest) || {}, Pv = (D.stats && D.stats.prev) || {};
  const s = L[brand === "thedaytodayshow" ? "daytodayshow" : brand] || {}, p = Pv[brand === "thedaytodayshow" ? "daytodayshow" : brand] || {};
  const nets = [["Instagram","instagram"],["TikTok","tiktok"],["YouTube","youtube"],["Facebook","facebook"]];
  let tv = 0, tf = 0, any = false;
  const rows = nets.map(([label, k]) => {
    const v = s[k + "_views_30d"], f = s[k + "_followers"], pv = p[k + "_views_30d"];
    if (v != null) { tv += Number(v); any = true; } if (f != null) tf += Number(f);
    let chg = "", cls = "var(--soft)";
    if (v != null && pv) { const pct = (v - pv) / pv * 100; if (Math.abs(pct) >= 0.5) { chg = (pct > 0 ? "up " : "down ") + Math.abs(pct).toFixed(Math.abs(pct) < 10 ? 1 : 0) + "%"; cls = pct > 0 ? "var(--good)" : "var(--badtext)"; } else chg = "about the same"; }
    if (v == null && f == null) return `<span style="display:grid;grid-template-columns:1.3fr 2fr;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--hair)"><b style="font-size:16px">${label}</b><span class="ph" style="text-align:right">Not tracked yet</span></span>`;
    return `<span style="display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--hair);font-variant-numeric:tabular-nums">
      <b style="font-size:16px">${label}</b>
      <span style="display:flex;flex-direction:column;align-items:flex-end"><b>${fmt(v)}</b><small style="font-size:12px;font-weight:700;color:${cls}">${esc(chg)}</small></span>
      <b style="text-align:right">${fmt(f)}</b></span>`;
  }).join("");
  const igNow = s.instagram_views_30d, igPrev = p.instagram_views_30d;
  const note = (igNow != null && igPrev) ? (igNow < igPrev ? "Instagram is dropping. Your lessons in Stats say what to post more of." : "Instagram is growing. Keep doing what's working.") : "";
  const inner = `<span class="lab" style="padding:16px 16px 0">ALL APPS, LAST 30 DAYS</span>
    <span style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 16px 14px">
      <span style="display:flex;flex-direction:column;background:var(--sunk);border-radius:14px;padding:12px"><small class="ph" style="font-weight:700">Total views</small><b class="bigno">${any ? fmt(tv) : "—"}</b></span>
      <span style="display:flex;flex-direction:column;background:var(--sunk);border-radius:14px;padding:12px"><small class="ph" style="font-weight:700">Total followers</small><b class="bigno">${tf ? fmt(tf) : "—"}</b></span>
    </span>
    <span style="display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;padding:8px 16px;border-top:1px solid var(--hair);font-size:13px;font-weight:700;color:var(--soft)"><span>App</span><span style="text-align:right">Views</span><span style="text-align:right">Followers</span></span>
    ${rows}${note ? `<span style="padding:12px 16px 16px;border-top:1px solid var(--hair)">${esc(note)}</span>` : ""}`;
  return link ? `<button class="card" data-a="tab:stats" style="width:100%;text-align:left;padding:0;display:flex;flex-direction:column;overflow:hidden">${inner}</button>`
              : `<section class="card" style="padding:0;display:flex;flex-direction:column;overflow:hidden">${inner}</section>`;
}

function listView(){

function strip(){

function weekView(){

    <span class="mini">Tap a box to open the post, or a day to see it big.</span>`;
}
function monthView(){

// ---------- the post sheet ----------
function openSlots(type, days){ return emptySlots(today(), days || 14).filter(x => x.type === type && (x.date + "T" + x.time) > addDays(today(), 0) + "T" + etNow().slice(11, 16)); }

const DAYS = [["1 day","8 hrs filming",1],["2 days","16 hrs filming",2],["3 days","24 hrs filming",3]];
const MINS = [["1 min","4 hrs editing",1],["2 min","8 hrs editing",2],["3 min","12 hrs editing",3],["5 min","20 hrs editing",5]];
const LIC = [["Just for them","Their own page only",1],["Their website and social","Organic posts",1.15],["Paid ads, 1 year","They can boost it",1.5],["They own it forever","Full buyout",2.25]];
const APPS = [["ig","Instagram reel",150],["tt","TikTok",100],["yts","YouTube Short",75],["show","On the Show",400]];
const EXTRAS = [["rush","Rush, under 3 days","x1.35"],["wknd","Weekend or after hours","x1.15"],["drone","Drone","+$150"],["second","Second shooter","+$500 a day"]];
function rnd(n){ return n > 1000 ? Math.round(n / 50) * 50 : Math.round(n / 25) * 25; }
function quoteCalc(){
  const days = DAYS[S.days][2], mins = MINS[S.mins][2], lic = LIC[S.lic][2];
  const hours = 8 * days + 4 * mins, base = 1500 + 400 * (mins - 1) + 600 * (days - 1);
  const mult = lic * (S.ex.rush ? 1.35 : 1) * (S.ex.wknd ? 1.15 : 1);
  const adds = (S.ex.drone ? 150 : 0) + (S.ex.second ? 500 * days : 0);
  let post = 0; APPS.forEach(a => { if (S.apps[a[0]]) post += a[2]; });
  const target = rnd(Math.max(base, hours * 110) * mult + adds + post);
  let floor = Math.max(hours * 87 * (lic > 1 ? lic * 0.85 : 1) + adds + post, 0.62 * target);
  if (floor >= target) floor = 0.75 * target;
  return { hours, target, floor: rnd(floor), ask: rnd(target * 140 / 110), perHour: Math.round(target / hours) };
}
function quoteText(q){
  const lic = ["for personal use", "for use on your website and social channels", "for use in paid advertising for one year", "with a full buyout of all rights"][S.lic];
  return "For this shoot, my rate is " + usd(q.target) + ". That covers " + q.hours + " hours of my work from shoot to delivery, " + lic + ". A 50% deposit books the date.";
}
function money(){

  <span class="q"><em>1</em>How many shoot days? <small>A day is 8 hours</small></span>
  <div class="opts" style="grid-template-columns:repeat(3,minmax(0,1fr))">${DAYS.map((o, i) => opt("days:" + i, S.days === i, o[0], o[1])).join("")}</div>

document.addEventListener("click", e => {

    case "filter": S.filter = v; break;

    case "day": S.day = v; break;
    case "dayopen": S.day = v; S.stripStart = v < today() ? v : (S.stripStart && v >= S.stripStart && v <= addDays(S.stripStart, 6) ? S.stripStart : v); S.pview = "day"; break;
    case "stripmove": S.stripStart = addDays(S.stripStart || today(), Number(v)); if (S.stripStart < addDays(today(), -28)) S.stripStart = addDays(today(), -28); S.day = S.stripStart; break;
    case "daymove": { const d = addDays(S.day < today() ? today() : S.day, Number(v)); S.day = d < today() ? today() : d; break; }
    case "mmove": S.month = Math.max(-1, Math.min(2, S.month + Number(v))); break;
    case "post": S.post = v; S.sheetMode = ""; S.ed = null; break;
    case "edrm": if (S.ed) S.ed.collabs = S.ed.collabs.filter(h => h !== v); break;
    case "edsug": { const it = findItem(S.post); if (S.ed && it && S.ed.collabs.length < maxCollabs(it) && !S.ed.collabs.includes(v)) S.ed.collabs.push(v); break; }
    case "edadd": { const it = findItem(S.post); const h = String((S.ed && S.ed.add) || "").trim().replace(/^@+/, "").toLowerCase();

          const r = await app("edit_drop", body);
          applyDrop(it.id, body); S.post = null; S.ed = null;
          const b4 = r.before || {};
          say(r.rehanded ? "Saved. Metricool got the new version." : "Saved.", () => run("Undoing…", async () => {
            const back = { id: it.id }; if (body.caption !== undefined) back.caption = b4.caption; if (body.hashtags !== undefined) back.hashtags = b4.hashtags || "";
            if (body.collabs !== undefined) back.collabs = b4.collabs || []; if (body.to_et !== undefined && b4.to_et) back.to_et = b4.to_et;
            await app("edit_drop", back); applyDrop(it.id, back); say("Undone."); }));
        });
      } else {
        const body = { id: it.id };
        if (e.caption !== String(it.caption || "")) body.caption = e.caption;
        if (!same(e.collabs, it.collabList || [])) body.collabs = e.collabs;
        if (e.date !== it.date || e.time !== it.time) { if (!e.date || !e.time) { say("Pick a date and a time.", null, true); return; } body.date = e.date; body.time = e.time; }
        if (Object.keys(body).length === 1) { say("Nothing changed."); return; }
        run("Saving…", async () => {
          const r = await app("edit_show", body);
          const row = (D.show_posts || []).find(x => x.id === it.id); const b4 = r.before || {};
          if (row) { row.data = Object.assign({}, row.data, body.caption !== undefined ? { caption: body.caption } : {}, body.collabs ? { collabs: body.collabs.map(h => "@" + h) } : {}, body.date ? { date: body.date, time: body.time } : {}); row.pending_edit = Object.assign({}, row.pending_edit || {}, body); }
          S.post = null; S.ed = null;
          say("Saved. It goes into the show calendar within 2 hours.", () => run("Undoing…", async () => {
            await app("edit_show", { id: it.id, undo: true, restore: b4.pending_edit || null, restore_data: b4.data });
            if (row) { row.data = b4.data; row.pending_edit = b4.pending_edit || null; } say("Undone."); }));
        });
      }
      return; }

    case "slot": S.post = null; S.upload = { kind: (findItem(v) || {}).type === "photo" ? null : "yap", step: "idea" }; if (!S.upload.kind) S.upload = { kind: null }; break;
    case "postclose": S.post = null; S.sheetMode = ""; break;
    case "sheetmode": S.sheetMode = v; break;
    case "approve": run("Approving…", async () => { await app("approve_show", { id: v }); patchShow(v, { approved_at: new Date().toISOString() }); S.post = null;
        say("Approved. It goes out on time.", () => run("Undoing…", async () => { await app("approve_show", { id: v, undo: true }); patchShow(v, { approved_at: null }); say("Undone."); })); }); return;
    case "unapprove": run("Saving…", async () => { await app("approve_show", { id: v, undo: true }); patchShow(v, { approved_at: null }); say("Approval taken back."); }); return;
    case "unfix": run("Saving…", async () => { await app("fix_show", { id: v, undo: true }); patchShow(v, { fix_note: null }); S.post = null; say("Fix cancelled."); }); return;
    case "sendfix": { const it = findItem(S.post), note = ((document.getElementById("fixbox") || {}).value || "").trim();
      if (!note) { say("Type what should change first.", null, true); return; }
      run("Sending…", async () => {
        if (it.src === "show") { await app("fix_show", { id: it.id, note }); patchShow(it.id, { fix_note: note }); }
        else { await app("fix_drop", { id: it.id, note }); D.requests = (D.requests || []).concat([{ kind:"fix_drop", target: it.id }]); }
        S.post = null; S.sheetMode = "";
        say("Fix sent. It gets changed by morning.", () => run("Undoing…", async () => {
          if (it.src === "show") { await app("fix_show", { id: it.id, undo: true }); patchShow(it.id, { fix_note: null }); }
          else { await app("fix_drop", { id: it.id, undo: true }); D.requests = (D.requests || []).filter(q => !(q.kind === "fix_drop" && q.target === it.id)); }
          say("Undone."); })); }); return; }
    case "savecaption": { const it = findItem(S.post), cap = ((document.getElementById("capbox") || {}).value || "").trim(), old = it.caption;
      if (!cap) { say("The caption can't be empty.", null, true); return; }
      run("Saving the caption…", async () => { await drop("set_caption", { id: it.id, caption: cap }); setDropCaption(it.id, cap); S.sheetMode = "";
        say("Caption saved.", old ? () => run("Undoing…", async () => { await drop("set_caption", { id: it.id, caption: old }); setDropCaption(it.id, old); say("Undone."); }) : null); }); return; }
    case "moveto": { const it = findItem(S.post), from = it.date + "T" + it.time;
      run("Moving…", async () => { await app("move_drop", { id: it.id, to_et: v }); setDropTime(it.id, v); S.post = null; S.sheetMode = ""; S.day = v.slice(0, 10);
        say("Moved to " + dayLabel(v.slice(0, 10)) + " at " + clock(v.slice(11, 16)) + ".", () => run("Moving back…", async () => { await app("move_drop", { id: it.id, to_et: from }); setDropTime(it.id, from); say("Moved back."); })); }); return; }
    case "dismiss": run("Saving…", async () => { await app("dismiss", { key: v }); const id = v.replace(/^collab:/, ""); const keep = D.collab_checks; D.collab_checks = keep.filter(c => c.id !== id);
        say("Marked done.", () => run("Undoing…", async () => { await app("dismiss", { key: v, undo: true }); D.collab_checks = keep; say("Undone."); })); }); return;
    case "upload": S.post = null; S.upload = { kind: null }; break;
    case "uploadkind": S.post = null; S.upload = { kind: v }; { const st = upSteps(v); S.upload.step = st[0]; if (st[0] === "drive") { draw(); upDrive(); return; } } break;
    case "upclose": S.upload = null; break;
    case "upback": { const u = S.upload; if (!u.kind) { S.upload = null; break; } const st = upSteps(u.kind), k = st.indexOf(u.step); if (k <= 0) S.upload = { kind: null }; else { u.step = st[k - 1]; u.err = ""; } break; }
    case "upcollab": S.upload.handle = v; upDrive(); return;
    case "upcollabother": { const h = ((document.getElementById("upother") || {}).value || "").trim().replace(/^@+/, "");
      if (!/^[a-z0-9._]{1,30}$/i.test(h)) { say("That doesn't look like an Instagram handle.", null, true); return; } S.upload.handle = h; upDrive(); return; }
    case "upidea": S.upload.ideaId = v === "none" ? null : v; upDrive(); return;
    case "upretry": upDrive(); return;
    case "copyname": copyText(S.upload.name, () => say("Copied. Paste it as the file name.")); return;
    case "filmed": S.upload = { kind: "yap", step: "drive", ideaId: v }; draw(); upDrive(); return;
    case "skip": { const id = v; let undone = false; S.skipping[id] = true; draw();
      say("Skipped.", () => { undone = true; delete S.skipping[id]; say("Undone."); draw(); });
      setTimeout(() => { if (!undone) drop("idea_skip", { id }).then(() => load(), () => { delete S.skipping[id]; say("Couldn't skip it. Try again.", null, true); draw(); }); }, 6200);
      return; }
    case "ideamove": { const n = ((D.board.film || {}).list || []).filter(x => !S.skipping[x.id]).length || 1; S.idea = (S.idea + Number(v) + n) % n; S.ftab = "script"; break; }
    case "ftab": S.ftab = v; break;
    case "stab": S.statsTab = v; break;
    case "acc": S.open[v] = !S.open[v]; break;
    case "tag": { const [id, fmtv] = v.split("|"); const before = D.tag_queue;
      run("Saving…", async () => { await app("tag_post", { id, format: fmtv }); D.tag_queue = before.filter(q => q.id !== id);
        say("Got it. I'll learn from that.", () => run("Undoing…", async () => { await app("tag_post", { id, undo: true }); D.tag_queue = before; say("Undone."); })); }); return; }
    case "days": S.days = Number(v); break;
    case "mins": S.mins = Number(v); break;
    case "lic": S.lic = Number(v); break;
    case "app": S.apps[v] = !S.apps[v]; break;
    case "ex": S.ex[v] = !S.ex[v]; break;
    case "copyquote": copyText(quoteText(quoteCalc()), () => say("Quote copied. Paste it in your text.")); return;
    case "savequote": { const q = quoteCalc();
      run("Saving to HQ…", async () => { await app("request", { kind: "hq_quote", payload: { quote: q.target, floor: q.floor, ask: q.ask, hours: q.hours, days: DAYS[S.days][2], minutes: MINS[S.mins][2], license: LIC[S.lic][0], post_on: APPS.filter(x => S.apps[x[0]]).map(x => x[1]), extras: EXTRAS.filter(x => S.ex[x[0]]).map(x => x[1]), text: quoteText(q) } });
        say("Saved. It shows up on your HQ board tonight as a quoted card. Add the client's name there."); }); return; }
    case "clientreq": run("Saving…", async () => { await app("request", { kind: v, target: acct()[6] }); say(v === "client_pdf" ? "Got it. The PDF gets made as soon as their numbers are in Metricool." : "Saved. The approval link gets built once they're in Metricool."); }); return;
    case "theme": theme = v; document.documentElement.setAttribute("data-theme", v); try { localStorage.setItem("dtd-board-theme", v); } catch (x) {} break;
    case "creditopen": S.creditOpen = S.creditOpen === v ? "" : v; break;
    case "aiadd": { const n = Number(((document.getElementById("aiamt") || {}).value || "").replace(/[^0-9.]/g, ""));
      if (!(n > 0)) { say("Type a dollar amount.", null, true); return; }
      run("Saving…", async () => { const r = await drop("ai_credit", { usd: n }); if (r.ai) D.board.ai = r.ai; S.creditOpen = ""; say("Saved $" + n + "."); }); return; }
    case "aikey": { const k = ((document.getElementById("aikey") || {}).value || "").trim();
      if (!/^sk-ant-admin/.test(k)) { say("That key should start with sk-ant-admin.", null, true); return; }
      run("Checking the key…", async () => { const r = await drop("ai_key", { key: k }); if (r.ai) D.board.ai = r.ai; S.creditOpen = ""; say("Key works."); }); return; }
    case "forgetkey": try { localStorage.removeItem("dtd_show_key"); localStorage.removeItem("dtd-show-key"); } catch (x) {} location.reload(); return;
    case "undo": if (UNDO) { const f = UNDO; UNDO = null; clearTimeout(tt); S.toast = ""; f(); } return;
    case "keygo": { KEY = ((document.getElementById("kin") || {}).value || "").trim(); if (!KEY) return;
      document.getElementById("app").innerHTML = '<div class="loading">Checking…</div>';
      app("app_board").then(j => { try { localStorage.setItem("dtd_show_key", KEY); } catch (x) {} D = j; draw(); startPolling(); }, () => lockScreen("That key didn't work. Try again.")); return; }
    default: return;
  }
  draw();
});
function patchShow(id, f){ const r = (D.show_posts || []).find(x => x.id === id); if (r) Object.assign(r, f); }
function setDropCaption(id, cap){ for (const k of ["upcoming","failed","posted"]) for (const r of ((D.board || {})[k] || [])) if (r.id === id) { r.caption = cap; r.metricool_id = null; } }
function applyDrop(id, body){
  for (const k of ["upcoming","failed","posted"]) for (const r of ((D.board || {})[k] || [])) if (r.id === id) {
    if (body.caption !== undefined) r.caption = body.caption;
    if (body.hashtags !== undefined) r.hashtags = body.hashtags;
    if (body.collabs !== undefined) { r.plan = Object.assign({}, r.plan || {}); r.plan.collaborators = body.collabs.concat(r.lane === "camera" ? [STUDIO] : []); }
    if (body.to_et) r.post_at_et = body.to_et + ":00";
  }
}
function setDropTime(id, wall){ for (const r of ((D.board || {}).upcoming || [])) if (r.id === id) r.post_at_et = wall + ":00"; }
document.addEventListener("input", e => { const f = e.target && e.target.dataset && e.target.dataset.f; if (f && S.ed) S.ed[f] = e.target.value; });
document.addEventListener("change", e => { const f = e.target && e.target.dataset && e.target.dataset.f; if (f && S.ed) S.ed[f] = e.target.value; });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target && e.target.id === "edadd") { e.preventDefault(); const b = document.querySelector('[data-a="edadd"]'); if (b) b.click(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (S.post || S.upload || S.acctOpen) { S.post = null; S.upload = null; S.acctOpen = false; draw(); } } if (e.key === "Enter" && e.target && e.target.id === "kin") document.querySelector('[data-a="keygo"]').click(); });

function lockScreen(msg){
  document.getElementById("navin").innerHTML = "";
  document.getElementById("app").innerHTML = `<div class="lockbox"><h1>DayToDay</h1><span>${esc(msg || "Enter your show key once. This phone remembers it.")}</span>
    <label for="kin" class="lab">SHOW KEY</label><input id="kin" class="field" type="password" autocomplete="off" placeholder="DTD-SHOW-..."><button class="btn big" data-a="keygo">Open</button></div>`;
}
let polling = false;
function startPolling(){
  if (polling) return; polling = true;
  setInterval(() => { if (!document.hidden && !S.busy && !S.post && !S.upload) load(); }, HOSTED ? 90000 : 180000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !S.post && !S.upload) load(); });
}
(async function boot(){
  draw();
  if (!window.claude || typeof window.claude.use !== "function") {
    HOSTED = true;
    try { KEY = localStorage.getItem("dtd_show_key") || localStorage.getItem("dtd-show-key") || ""; } catch (e) {}
    if (!KEY) { lockScreen(); return; }
    await load(); startPolling(); return;
  }
  try { MCP = await window.claude.use("mcp"); } catch (e) { MCP = null; }
  if (!MCP) { S.loadErr = "Live data only loads with Supabase connected in Claude."; draw(); return; }
  await load(); startPolling();
})();
})();
